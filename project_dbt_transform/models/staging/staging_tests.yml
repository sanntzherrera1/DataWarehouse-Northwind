version: 2

models:
  - name: stg_categories
    columns:
      - name: category_id
        data_tests:
          - unique
          - not_null

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_employees
    columns:
      - name: employee_id
        data_tests:
          - unique
          - not_null

  - name: stg_shippers
    columns:
      - name: shipper_id
        data_tests:
          - unique
          - not_null

  - name: stg_suppliers
    columns:
      - name: supplier_id
        data_tests:
          - unique
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: unit_price
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_orders
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "shipped_date >= order_date"
          config:
            where: "shipped_date is not null"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: freight
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_order_details
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - product_id
    columns:
      - name: unit_price
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: discount
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1